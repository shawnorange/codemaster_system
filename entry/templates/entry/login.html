{% load static %}
<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CodeMaster 大师码教学系统</title>
    <link rel="icon" type="image/png" href="{% static 'entry/images/title.png' %}">
    <link rel="shortcut icon" href="{% static 'entry/images/title.png' %}">
    <link rel="preload" as="image" href="{% static 'entry/images/superpanda-transparent.png' %}" fetchpriority="high">
    <link rel="stylesheet" href="{% static 'entry/css/login.css' %}">
</head>
<body>
    <div class="page-shell">
        <header class="site-header">
            <div class="brand-mark">
                <img src="{% static 'entry/images/logo.svg' %}" alt="机构 Logo" class="brand-mark__icon">
                <div class="brand-mark__text">
                    <p class="brand-mark__label">CodeMaster Campus</p>
                    <h1>大师码教学系统</h1>
                </div>
            </div>
        </header>

        <main class="main-layout">
            <section class="showcase-panel" aria-label="品牌展示区">
                <div class="showcase-panel__glow"></div>
                <div class="showcase-panel__copy">
                    <p class="eyebrow eyebrow--preserve-case">You are the MVP.</p>
                    <h2 class="showcase-panel__title">
                        <span class="showcase-panel__title-line">学.好科创</span>
                        <span class="showcase-panel__title-line">做.好自己</span>
                    </h2>
                    <div class="feature-pills">
                        <span>课堂管理</span>
                        <span>教学协同</span>
                        <span>校区运营</span>
                    </div>
                </div>
                <div class="showcase-panel__mascot">
                    <img src="{% static 'entry/images/superpanda-transparent.png' %}" alt="公司吉祥物形象" width="920" height="1332" loading="eager" decoding="async" fetchpriority="high">
                </div>
            </section>

            <section class="login-panel" aria-label="登录卡片区">
                <div class="login-card">
                    <p class="login-card__eyebrow">Welcome Back</p>
                    <h2>账号登录</h2>
                    <p class="login-card__intro">当前所有角色统一使用账号和密码登录，登录后再按角色进入对应工作台。</p>

                    <form class="login-form" action="{% url 'login' %}" method="post">
                        {% csrf_token %}
                        {% if error_message %}
                            <div class="form-error">{{ error_message }}</div>
                        {% endif %}

                        <label class="field">
                            <span>账号</span>
                            <input type="text" name="username" value="{{ username|default:'' }}" placeholder="请输入账号" autocomplete="username">
                        </label>

                        <label class="field">
                            <span>密码</span>
                            <input type="password" name="password" placeholder="请输入登录密码" autocomplete="current-password">
                        </label>

                        <button type="submit" class="login-button">进入系统</button>
                    </form>

                    <div class="login-card__note">
                        <span class="dot"></span>
                        当前已接入统一账号认证闭环，后续再继续补齐密码重置等能力
                    </div>
                </div>
            </section>
        </main>

        <footer class="site-footer">
            <span class="site-footer__tag">@ 2026 上海宝睿蒙教育科技有限公司</span>
        </footer>
    </div>
</body>
</html>
