map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream codemaster_web {
    server web:8000;
}

upstream codemaster_realtime {
    server realtime:8001;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    location /static/ {
        alias /var/www/codemaster/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /media/ {
        alias /var/www/codemaster/media/;
        try_files $uri =404;
    }

    location /ws/ {
        proxy_pass http://codemaster_realtime;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://codemaster_web;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
        send_timeout 130s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

