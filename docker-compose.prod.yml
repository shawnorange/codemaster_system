services:
  db:
    image: postgres:15
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - /opt/codemaster/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - /opt/codemaster/staticfiles:/app/staticfiles
      - /opt/codemaster/media:/app/media
    command: gunicorn codemaster_system.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --timeout ${GUNICORN_TIMEOUT:-120}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/codemaster.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/codemaster/staticfiles:/var/www/codemaster/staticfiles:ro
      - /opt/codemaster/media:/var/www/codemaster/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
