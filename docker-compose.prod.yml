services:
  db:
    image: postgres:15
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - /opt/codemaster/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    build:
      context: .
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - /opt/codemaster/staticfiles:/app/staticfiles
      - /opt/codemaster/media:/app/media
    command: sh -c "python manage.py collectstatic --noinput && gunicorn codemaster_system.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --timeout $${GUNICORN_TIMEOUT:-120}"

  homework-import-worker:
    build:
      context: .
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /opt/codemaster/media:/app/media
    command: python manage.py process_homework_import_jobs --poll-interval 2

  exam-paper-import-worker:
    build:
      context: .
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /opt/codemaster/media:/app/media
    command: python manage.py process_exam_paper_import_jobs --poll-interval 2

  realtime:
    build:
      context: .
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8001"
    command: daphne -b 0.0.0.0 -p 8001 codemaster_system.asgi:application

  livekit:
    image: livekit/livekit-server:latest
    profiles:
      - livekit
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: --bind 0.0.0.0
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          port_range_start: ${LIVEKIT_RTC_PORT_RANGE_START:-50000}
          port_range_end: ${LIVEKIT_RTC_PORT_RANGE_END:-50100}
          use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP:-true}
        redis:
          address: redis:6379
        keys:
          "${LIVEKIT_API_KEY:-}": "${LIVEKIT_API_SECRET:-}"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "${LIVEKIT_RTC_PORT_RANGE_START:-50000}-${LIVEKIT_RTC_PORT_RANGE_END:-50100}:${LIVEKIT_RTC_PORT_RANGE_START:-50000}-${LIVEKIT_RTC_PORT_RANGE_END:-50100}/udp"

  livekit-egress:
    image: livekit/egress:latest
    profiles:
      - livekit
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    environment:
      EGRESS_CONFIG_BODY: |
        log_level: info
        api_key: ${LIVEKIT_API_KEY:-}
        api_secret: ${LIVEKIT_API_SECRET:-}
        ws_url: ws://livekit:7880
        insecure: true
        redis:
          address: redis:6379
    volumes:
      - /opt/codemaster/media:/recordings

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - realtime
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/codemaster.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/codemaster/staticfiles:/var/www/codemaster/staticfiles:ro
      - /opt/codemaster/media:/var/www/codemaster/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
