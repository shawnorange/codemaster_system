    get:
      operationId: get_login
      summary: "login"
      description: "登录与门户；CSRF: required；View: entry.views.login_page"
      responses:
        '200':
          description: 成功
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Redirect
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '404':
          description: 未找到资源
    post:
