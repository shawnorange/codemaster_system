openapi: 3.0.3
info:
  title: CodeMaster System Routes
  version: "1.0.0"
  description: "当前系统路由文档，生成时间 2026-05-08 15:09:47 CST；不包含真实密钥、Cookie、手机号或学生隐私。"
servers:
  - url: https://example.com
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: codemaster_auth
    codemasterToken:
      type: apiKey
      in: header
      name: Authorization
      description: "格式：Codemaster <signed-token>"
  schemas:
    GenericError:
      type: object
      properties:
        error:
          type: string
        error_code:
          type: string
    MiniappLoginRequest:
      type: object
      properties:
        username:
          type: string
          example: parent_demo
        password:
          type: string
          example: "<password>"
      required: [username, password]
    MiniappPhoneLoginRequest:
      type: object
      properties:
        code:
          type: string
          example: wx_login_code_demo
      required: [code]
    MiniappLoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          type: object
    GenericJson:
      type: object
paths:
